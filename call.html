<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Messenger — Call</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #111214;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    user-select: none;
}

#call-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Remote video — fills everything */
#remote-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #18191c;
}

#remote-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #18191c;
}

#remote-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
}

#remote-name-big {
    font-size: 22px;
    font-weight: 600;
    color: #f2f3f5;
}

/* Local video — corner overlay */
#local-wrap {
    position: absolute;
    bottom: 90px;
    right: 16px;
    width: 160px;
    height: 90px;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
    background: #2b2d31;
    z-index: 10;
    cursor: pointer;
}

#local-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
}

#local-cam-off {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #2b2d31;
    color: #87898c;
    font-size: 11px;
}

/* Top bar */
#top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 10;
}

#top-logo {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    letter-spacing: 0.02em;
}

#call-with {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    flex: 1;
}

#call-timer {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.7);
    min-width: 40px;
    text-align: right;
}

/* Status overlay */
#status-overlay {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    z-index: 10;
    pointer-events: none;
}

/* Controls */
#controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    z-index: 10;
}

.ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.15);
    color: #fff;
    transition: background 0.15s, transform 0.1s;
    position: relative;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
.ctrl-btn.off { background: rgba(255,255,255,0.12); }
.ctrl-btn.off svg { opacity: 0.4; }
.ctrl-btn.screen-active { background: #5865f2; }
.ctrl-btn.hangup-btn { background: #ed4245; width: 60px; height: 60px; }
.ctrl-btn.hangup-btn:hover { background: #c03537; }

.ctrl-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="call-wrap">
    <video id="remote-video" autoplay playsinline></video>

    <div id="remote-placeholder">
        <div id="remote-avatar"></div>
        <div id="remote-name-big"></div>
    </div>

    <div id="local-wrap">
        <video id="local-video" autoplay playsinline muted></video>
        <div id="local-cam-off">Cam off</div>
    </div>

    <div id="top-bar">
        <span id="top-logo">Canvas Messenger</span>
        <span id="call-with">Connecting…</span>
        <span id="call-timer"></span>
    </div>

    <div id="status-overlay">Connecting…</div>

    <div id="controls">
        <button class="ctrl-btn" id="btn-mic" title="Mute">
            <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
            <span class="ctrl-label">Mic</span>
        </button>
        <button class="ctrl-btn" id="btn-cam" title="Camera">
            <svg id="cam-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
            <span class="ctrl-label">Camera</span>
        </button>
        <button class="ctrl-btn" id="btn-screen" title="Share screen">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/>
            </svg>
            <span class="ctrl-label">Share</span>
        </button>
        <button class="ctrl-btn hangup-btn" id="btn-hangup" title="Hang up">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.01L6.6 10.8z"/>
            </svg>
            <span class="ctrl-label">Hang up</span>
        </button>
    </div>
</div>
<script src="call.js"></script>
</body>
</html>
