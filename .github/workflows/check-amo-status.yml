name: Check AMO Status (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query AMO version status
        run: |
          pip install PyJWT requests --quiet
          python3 - <<'EOF'
          import jwt, time, requests, os
          key    = os.environ['AMO_API_KEY']
          secret = os.environ['AMO_API_SECRET']
          payload = {'iss': key, 'jti': str(time.time()), 'iat': time.time(), 'exp': time.time() + 300}
          token   = jwt.encode(payload, secret, algorithm='HS256')
          headers = {'Authorization': f'JWT {token}'}
          url = 'https://addons.mozilla.org/api/v5/addons/addon/canvas-messenger@hackatoa/versions/'
          r = requests.get(url, headers=headers)
          print(r.status_code)
          print(r.text)
          EOF
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
