name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Sign Firefox extension
        run: |
          web-ext sign \
            --source-dir=dist/firefox \
            --channel=unlisted \
            --api-key="${{ secrets.AMO_API_KEY }}" \
            --api-secret="${{ secrets.AMO_API_SECRET }}" \
            --artifacts-dir=dist/signed
          echo "XPI=$(ls dist/signed/*.xpi)" >> $GITHUB_ENV

      - name: Submit to AMO (listed)
        continue-on-error: true
        run: |
          pip install PyJWT requests --quiet
          python3 .github/scripts/submit-amo.py
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="## Install

          **Firefox:** Download the \`.xpi\` → drag into Firefox, or \`about:addons\` → gear → Install Add-on From File.

          **Chrome:** Download \`canvas-messenger-chrome.zip\` → unzip → \`chrome://extensions\` → Developer mode → Load unpacked."

          gh release create "$TAG" \
            dist/canvas-messenger-chrome.zip \
            "$XPI" \
            --title "Canvas Messenger $TAG" \
            --notes "$NOTES"
