name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Sign Firefox extension
        run: |
          web-ext sign \
            --source-dir=dist/firefox \
            --channel=unlisted \
            --api-key="${{ secrets.AMO_API_KEY }}" \
            --api-secret="${{ secrets.AMO_API_SECRET }}" \
            --artifacts-dir=dist/signed
          echo "XPI=$(ls dist/signed/*.xpi)" >> $GITHUB_ENV

      - name: Submit to AMO (listed)
        continue-on-error: true
        run: |
          pip install PyJWT requests --quiet
          python3 - <<'PYEOF'
import jwt, time, requests, os, sys, glob, json

key    = os.environ['AMO_API_KEY']
secret = os.environ['AMO_API_SECRET']

payload = {'iss': key, 'jti': str(time.time()), 'iat': time.time(), 'exp': time.time() + 300}
token   = jwt.encode(payload, secret, algorithm='HS256')
headers = {'Authorization': f'JWT {token}'}

with open('dist/firefox/manifest.json') as f:
    version = json.load(f)['version']

xpis = glob.glob('dist/signed/*.xpi')
if not xpis:
    print('No XPI found, skipping AMO listed submission')
    sys.exit(0)

xpi_path = xpis[0]
url = f'https://addons.mozilla.org/api/v5/addons/canvas-messenger@hackatoa/versions/{version}/'
with open(xpi_path, 'rb') as f:
    r = requests.put(url, headers=headers, files={'upload': ('extension.xpi', f, 'application/x-xpinstall')})

if r.status_code in (200, 201, 202):
    print(f'AMO listed submission accepted: {r.status_code}')
else:
    print(f'AMO listed submission response: {r.status_code} {r.text}')
PYEOF
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/canvas-messenger-chrome.zip \
            "$XPI" \
            --title "Canvas Messenger ${{ github.ref_name }}" \
            --notes "## Install

**Firefox:** Download the \`.xpi\` → drag into Firefox, or \`about:addons\` → gear → Install Add-on From File.

**Chrome:** Download \`canvas-messenger-chrome.zip\` → unzip → \`chrome://extensions\` → Developer mode → Load unpacked."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
